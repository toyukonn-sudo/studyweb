<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勉強スケジュール作成・管理 | StudyLab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar"></div>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="container header-container">
      <div class="header-left">
        <a href="index.html" class="logo">StudyLab</a>
        <nav class="nav-menu">
          <ul>
            <li><a href="index.html">トップ</a></li>
            <li><a href="articles/list.html">勉強法一覧</a></li>
            <li><a href="schedule.html" class="active">スケジュール</a></li>
            <li><a href="#" onclick="alert('お問い合わせページ（準備中）'); return false;">お問い合わせ</a></li>
          </ul>
        </nav>
      </div>

      <div class="header-tools">
        <!-- ヘッダータイマー -->
        <div class="header-timer">
          <span id="timer-status-badge" class="timer-badge">25分集中</span>
          <span id="timer-display" class="timer-digits">25:00</span>
          <button id="timer-start-btn" class="timer-btn primary">▶</button>
          <button id="timer-reset-btn" class="timer-btn secondary">↺</button>
        </div>
        <!-- ナイトモード切替 -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="テーマ切り替え">🌙</button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="container">
      
      <!-- ページ見出し -->
      <header class="schedule-page-header">
        <span class="category">学習計画・進捗管理ツール</span>
        <h1 class="hero-title" style="font-size: 2rem; margin-top: 8px;">My 勉強スケジュール Planner</h1>
        <p class="hero-description">
          今日のやるべきタスクを可視化し、ポモドーロタイマーと連携して順番に撃破していきましょう。データはブラウザに自動保存されます。
        </p>
      </header>

      <!-- サマリーダッシュボード -->
      <section class="dashboard-grid">
        <div class="dash-card">
          <span class="dash-label">登録タスク数</span>
          <span id="dash-total-count" class="dash-value">0</span>
        </div>
        <div class="dash-card">
          <span class="dash-label">達成タスク数</span>
          <span id="dash-completed-count" class="dash-value text-green">0</span>
        </div>
        <div class="dash-card">
          <span class="dash-label">必要ポモドーロ目安</span>
          <span id="dash-total-pomo" class="dash-value text-blue">0 コマ (0分)</span>
        </div>
      </section>

      <!-- タスク追加フォーム -->
      <section class="schedule-form-card">
        <h2 class="form-card-title">＋ 新しい学習タスクの追加</h2>
        <form id="schedule-form" class="schedule-form">
          <div class="form-group">
            <label for="task-subject">教科・科目</label>
            <select id="task-subject" required>
              <option value="数学">📐 数学</option>
              <option value="英語">📝 英語</option>
              <option value="国語">📖 国語</option>
              <option value="理科">🧪 理科</option>
              <option value="社会">🌍 社会</option>
              <option value="情報・プログラミング">💻 情報/コード</option>
              <option value="その他">💡 その他</option>
            </select>
          </div>

          <div class="form-group flex-2">
            <label for="task-title">タスク内容（具体的に）</label>
            <input type="text" id="task-title" placeholder="例: チャート式 P.45 演習問題を3問解く" required>
          </div>

          <div class="form-group">
            <label for="task-pomo">予想コマ数（1コマ＝25分）</label>
            <select id="task-pomo">
              <option value="1">1コマ (25分)</option>
              <option value="2">2コマ (50分)</option>
              <option value="3">3コマ (75分)</option>
              <option value="4">4コマ (100分)</option>
            </select>
          </div>

          <button type="submit" class="add-task-btn">タスクを追加</button>
        </form>
      </section>

      <!-- スケジュールタスク一覧 -->
      <section class="schedule-list-section">
        <div class="schedule-header-actions">
          <h2 class="section-heading" style="margin-bottom: 0;">本日のタスクリスト</h2>
          <button id="clear-completed-btn" class="clear-btn">完了済みを消去</button>
        </div>

        <div id="schedule-list" class="schedule-list">
          <!-- JavaScriptにより動的に挿入されます -->
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 StudyLab. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
